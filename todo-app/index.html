<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="todo-card" aria-labelledby="app-title">
        <header class="header">
          <p class="eyebrow">Personal planner</p>
          <h1 id="app-title">To-Do List</h1>
        </header>

        <form id="todo-form" class="todo-form" aria-label="Add a new to-do item">
          <label class="sr-only" for="todo-input">New task</label>
          <input
            id="todo-input"
            type="text"
            maxlength="200"
            placeholder="What needs to be done?"
            autocomplete="off"
          />
          <button type="submit" class="primary-btn">Add</button>
        </form>

        <div class="toolbar">
          <div class="stats" aria-live="polite">
            <span id="items-left">0 items left</span>
          </div>

          <div class="filters" aria-label="Filter tasks">
            <button type="button" class="filter-btn active" data-filter="all">All</button>
            <button type="button" class="filter-btn" data-filter="active">Active</button>
            <button type="button" class="filter-btn" data-filter="completed">Completed</button>
          </div>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

        <footer class="footer">
          <button id="clear-completed" type="button" class="secondary-btn">
            Clear completed
          </button>
        </footer>
      </section>
    </main>

    <template id="todo-item-template">
      <li class="todo-item">
        <label class="todo-label">
          <input type="checkbox" class="todo-checkbox" />
          <span class="todo-text"></span>
        </label>
        <button type="button" class="delete-btn" aria-label="Delete task">Delete</button>
      </li>
    </template>

    <script src="script.js"></script>
  </body>
</html>
